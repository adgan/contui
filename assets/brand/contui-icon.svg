<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="contUI">
  <!-- contUI app icon. Full-bleed square artwork; macOS icon masking is applied
       when building the .icns (see scripts/make-icon). Colors come from src/theme.rs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151a"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="top" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#3a5374"/>
      <stop offset="1" stop-color="#27394f"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d2b3d"/>
      <stop offset="1" stop-color="#22344a"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#131c27"/>
      <stop offset="1" stop-color="#0c1118"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#3fb950" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#2f7bf6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2f7bf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#ambient)"/>

  <!-- isometric container cube; vertices on a 30-degree grid -->
  <g stroke="#3f86ff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <!-- top face -->
    <path d="M512 209 L777 362 L512 515 L247 362 Z" fill="url(#top)"/>
    <!-- left face -->
    <path d="M247 362 L512 515 L512 815 L247 662 Z" fill="url(#left)"/>
    <!-- right face -->
    <path d="M512 515 L777 362 L777 662 L512 815 Z" fill="url(#right)"/>
  </g>

  <!-- lid LED: the container is running -->
  <circle cx="512" cy="392" r="86" fill="url(#led)"/>
  <circle cx="512" cy="392" r="26" fill="#3fb950"/>
</svg>
