[package]
name = "dockyard"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
bollard = { version = "0.21", default-features = false, features = ["http", "pipe", "ssl", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
futures-util = "0.3"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[profile.release]
strip = true
