name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  # Everything that does not need macOS: the release, the source tarball, the formula.
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - name: Check the tag matches the app's version strings
        run: |
          grep -qx "version = \"$VERSION\"" Cargo.toml
          grep -A1 'CFBundleShortVersionString' assets/Info.plist | grep -q "<string>$VERSION</string>"
      - name: Refuse to overwrite a published release
        run: |
          # A bottle build is not reproducible. Re-publishing the same version replaces
          # the asset under the sha the tap already pins, and every install then fails
          # its checksum on a green run. Cut a new version instead.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            assets=$(gh release view "v$VERSION" --json assets -q '.assets | length')
            if [ "$assets" != "0" ]; then
              echo "v$VERSION already has $assets assets; refusing to overwrite. Cut a new version." >&2
              exit 1
            fi
          fi
      - name: Test the formula generator
        run: tests/release/generate_formula_test.sh
      - name: Create the release
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then exit 0; fi
          notes=".github/release-notes/$VERSION.md"
          if [ -f "$notes" ]; then
            gh release create "v$VERSION" --title "contUI $VERSION" --notes-file "$notes"
          else
            gh release create "v$VERSION" --title "contUI $VERSION" --generate-notes
          fi
      - name: Build source tarball and stable formula
        run: scripts/prepare-release.sh "$VERSION" dist
      - name: Publish source tarball
        run: gh release upload "v$VERSION" dist/contui-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: formula-base
          path: dist/contui.rb

  # The only macOS work: build the bottle from the formula the prepare job wrote.
  bottle:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: formula-base
          path: dist
      - name: Fetch the published source tarball
        # check-artifacts.sh holds the tarball and the bottle against each other, and the
        # tarball only exists as a release asset. Without it the check fails on its first
        # assertion, long before it can say anything about the bundle.
        run: gh release download "v$VERSION" --pattern "contui-*.tar.gz" --dir dist
      - name: Build bottle
        run: scripts/build-bottle.sh "$VERSION" dist
      - name: Check the artifacts a user actually gets
        run: scripts/check-artifacts.sh "$VERSION" dist
      - name: Test the installed keg
        run: brew test adgan/tap/contui
      - name: Publish bottle
        run: gh release upload "v$VERSION" dist/*.bottle.tar.gz
      - name: Publish formula for the tap
        run: |
          # The summary is markdown; unfenced Ruby loses its comments and indentation.
          { echo '```ruby'; cat dist/contui.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: dist/contui.rb
